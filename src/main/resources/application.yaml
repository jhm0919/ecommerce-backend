spring:
  config:
    import: optional:file:.env[.properties]

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope:
              - openid
              - email
              - profile

  mail:
    host: stmp.gmail
    port: 587
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true

  main:
    web-application-type: servlet # MVC 유지
#          kakao:
#            client-id: ${KAKAO_CLIENT_ID:dummy-kakao-id}        # ★ 기본값
#            client-secret: ${KAKAO_CLIENT_SECRET:dummy-secret}  # ★ 기본값
#            scope:
#              - profile_nickname
#              - profile_image
#              - account_email
#            authorization-grant-type: authorization_code
#            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
#            client-authentication-method: client_secret_post
#
#          naver:
#            client-id: ${NAVER_CLIENT_ID:dummy-naver-id}        # ★ 기본값
#            client-secret: ${NAVER_CLIENT_SECRET:dummy-secret}  # ★ 기본값
#            scope:
#              - name
#              - email
#              - profile_image
#            authorization-grant-type: authorization_code
#            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
#
#        # ★ provider는 registration과 같은 레벨 (client 직속)
#        provider:
#          kakao:
#            authorization-uri: https://kauth.kakao.com/oauth/authorize
#            token-uri: https://kauth.kakao.com/oauth/token
#            user-info-uri: https://kapi.kakao.com/v2/user/me
#            user-name-attribute: id
#          naver:
#            authorization-uri: https://nid.naver.com/oauth2.0/authorize
#            token-uri: https://nid.naver.com/oauth2.0/token
#            user-info-uri: https://openapi.naver.com/v1/nid/me
#            user-name-attribute: response   # ★ 'user-' 추가!

logging:
  level:
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE
  pattern:
#    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%X{traceId:-}] %logger{36} - %msg%n"
    console: "%clr(%d{yyyy-MM-dd HH:mm:ss.SSS}){faint} %clr(%-5level) [%clr(%X{traceId:-}){yellow}] %clr(%logger{36}){cyan} - %msg%n"

app:
  jwt:
    secret: ${JWT_SECRET:dev-only-secret-key-must-be-at-least-256-bits-long-for-hs256}
    access-token-validity-seconds: 1800
    refresh-token-validity-seconds: 1209600
  async:
    application:
      core-pool-size: ${ASYNC_APPLICATION_CORE_POOL_SIZE:4}
      max-pool-size: ${ASYNC_APPLICATION_MAX_POOL_SIZE:8}
      queue-capacity: ${ASYNC_APPLICATION_QUEUE_CAPACITY:200}
      await-termination-seconds: ${ASYNC_APPLICATION_AWAIT_TERMINATION_SECONDS:30}
    notification:
      core-pool-size: ${ASYNC_NOTIFICATION_CORE_POOL_SIZE:4}
      max-pool-size: ${ASYNC_NOTIFICATION_MAX_POOL_SIZE:10}
      queue-capacity: ${ASYNC_NOTIFICATION_QUEUE_CAPACITY:500}
      await-termination-seconds: ${ASYNC_NOTIFICATION_AWAIT_TERMINATION_SECONDS:30}
  cors:
    allowed-origins:
      - http://localhost:3000
  seed:
    performance:
      enabled: false

  fastapi:
    base-url: ${FASTAPI_BASE_URL:http://localhost:8080}
    timeout-seconds: 5

  mail:
    from: ${MAIL_USERNAME}
    from-name: "이커머스 플랫폼"


# ─────────────────────────────────────
# Swagger / OpenAPI
# ─────────────────────────────────────
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
    display-request-duration: true
  api-docs:
    path: /v3/api-docs
  default-produces-media-type: application/json

# ─────────────────────────────────────
# Actuator / Prometheus
# ─────────────────────────────────────
management:
  endpoints:
    web:
      exposure:
        include: health, info, prometheus, metrics

  endpoint:
    prometheus:
      enabled: true
    health:
      show-details: always

  metrics:
    distribution:
      percentiles-histogram:
        order.member.create.time: true
        order.guest.create.time: true
        order.member.cancel.time: true
        order.seller.search.time: true
        order.seller.confirm.time: true
        order.seller.cancel.time: true
        product.search.time: true
        product.detail.time: true
        cart.get.time: true
        cart.add.time: true
        cart.change_quantity.time: true
        cart.remove.time: true
        cart.clear.time: true

    export:
      prometheus:
        enabled: true
    tags:
      application: ecommerce-customer



