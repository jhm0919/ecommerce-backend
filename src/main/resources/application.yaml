spring:
  config:
    import: optional:file:.env[.properties]

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope:
              - openid
              - email
              - profile

  main:
    web-application-type: servlet # MVC 유지

logging:
  level:
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE

app:
  auth:
    cookie:
      secure: false
      same-site: Lax
  jwt:
    secret: ${JWT_SECRET}
    access-token-validity-seconds: 1800
    refresh-token-validity-seconds: 1209600
  cors:
    allowed-origins:
      - http://localhost:3000
  seed:
    performance:
      enabled: false

# ─────────────────────────────────────
# Swagger / OpenAPI
# ─────────────────────────────────────
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
    display-request-duration: true
  api-docs:
    path: /v3/api-docs
  default-produces-media-type: application/json

# ─────────────────────────────────────
# Actuator / Prometheus
# ─────────────────────────────────────
management:
  endpoints:
    web:
      exposure:
        include: health, info, prometheus, metrics

  endpoint:
    prometheus:
      enabled: true
    health:
      show-details: always

  metrics:
    distribution:
      percentiles-histogram:
        order.member.create.time: true
        order.guest.create.time: true
        order.member.cancel.time: true
        order.seller.search.time: true
        order.seller.confirm.time: true
        order.seller.cancel.time: true
        product.search.time: true
        product.detail.time: true
        cart.get.time: true
        cart.add.time: true
        cart.change_quantity.time: true
        cart.remove.time: true
        cart.clear.time: true

    export:
      prometheus:
        enabled: true
    tags:
      application: ecommerce-backend



