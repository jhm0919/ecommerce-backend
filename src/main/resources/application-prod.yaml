spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    # 운영용 커넥션 풀 설정
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000

  jpa:
    hibernate:
      ddl-auto: validate   # ★ 운영은 validate! (스키마 변경 금지)
    show-sql: false        # 운영에선 SQL 로그 끔

app:
  auth:
    cookie:
      secure: true        # ★ HTTPS 필수
      same-site: Strict   # ★ 가장 엄격

  jwt:
    secret: ${JWT_SECRET}  # ★ 기본값 없음 (환경변수 필수)

logging:
  level:
    org.hibernate.SQL: WARN
    org.hibernate.orm.jdbc.bind: WARN
    com.mpcapstone.shadefinder: INFO