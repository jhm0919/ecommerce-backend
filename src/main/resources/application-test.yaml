spring:
  datasource:
#    url: jdbc:h2:mem:testdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    url: jdbc:h2:mem:testdb;MODE=MySQL;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
    # driver-class-name 생략 → 자동 감지 (H2)

  jpa:
    database: h2
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        ddl-auto: create-drop # 매 테스트마다 초기화
    show-sql: true
    generate-ddl: true
    database-platform: org.hibernate.dialect.H2Dialect

  # OAuth 더미 설정 (테스트에서 구글 실제 호출 안 함)
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: test-client-id
            client-secret: test-client-secret

  mail:
    host: localhost
    port: 3025
    username: test
    password: test

app:
  auth:
    cookie:
      secure: false
      same-site: Lax
  jwt:
    secret: test-secret-key-at-least-256-bits-long-for-hs256-algorithm-safe
  frontend:
    redirect-url: http://localhost:3000/auth/callback

logging:
  level:
    org.hibernate.SQL: WARN   # 테스트 로그는 조용하게