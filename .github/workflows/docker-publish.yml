name: Build and Push Docker Image
on:
  push:
    branches:
      - develop
      - main
jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      # ───────────────────────────────────────
      # 1. 소스 코드 가져오기
      # ───────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ───────────────────────────────────────
      # 2. JDK 17 셋업
      # ───────────────────────────────────────
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # ───────────────────────────────────────
      # 3. Gradle 캐시 (빌드 속도 향상)
      # ───────────────────────────────────────
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      # ───────────────────────────────────────
      # 4. gradlew 실행 권한
      # ───────────────────────────────────────
      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      # ───────────────────────────────────────
      # 5. 테스트 실행 (실패 시 중단)
      # ───────────────────────────────────────
      - name: Run tests
        run: ./gradlew test
        env:
          SPRING_PROFILES_ACTIVE: test

      # ───────────────────────────────────────
      # 6. jar 빌드 (테스트 제외 - 이미 위에서 실행)
      # ───────────────────────────────────────
#      - name: Build jar
#        run: ./gradlew bootJar -x test
      # ───────────────────────────────────────
      # 7. Docker Buildx 셋업 (효율적 이미지 빌드)
      # ───────────────────────────────────────
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ───────────────────────────────────────
      # 8. Docker Hub 로그인
      # ───────────────────────────────────────
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # ───────────────────────────────────────
      # 9. 브랜치별 태그 결정
      # ───────────────────────────────────────
      - name: Set branch tag
        id: tag
        run: |
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            echo "branch_tag=latest" >> $GITHUB_OUTPUT
          else
            echo "branch_tag=develop" >> $GITHUB_OUTPUT
          fi

      # ───────────────────────────────────────
      # 10. Docker 이미지 빌드 + Docker Hub push
      # ───────────────────────────────────────
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            kwondh1126/ecommerce-be:${{ steps.tag.outputs.branch_tag }}
            kwondh1126/ecommerce-be:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max