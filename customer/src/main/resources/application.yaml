spring:
  config:
    import: optional:file:.env[.properties]  # .env 파일을 불러오기 위한 설정

  # ★ 기본 프로파일 지정 (환경변수로 오버라이드 가능)
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: update   # 개발 단계에서는 update, 운영에서는 validate 권장
    show-sql: true       # SQL 로그 출력
    properties:
      hibernate:
        format_sql: true # SQL 포맷팅

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope:
              - openid
              - email
              - profile

logging:
  level:
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE

app:
  jwt:
    secret: ${JWT_SECRET:dev-only-secret-key-must-be-at-least-256-bits-long-for-hs256}
    access-token-validity-seconds: 1800         # 30분
    refresh-token-validity-seconds: 1209600     # 14일